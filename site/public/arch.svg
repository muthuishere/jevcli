<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="jevx architecture: a coding agent asks jevx a question; jevx adds context, saved questions and settings, calls a System One model, and returns a verdict with a probability and an exit code; agent events can also trigger plugins">
  <style>
    :root { --bg:#161a22; --card:#1d222c; --line:#343b48; --ink:#e7eaf0; --mute:#9aa3b2; --acc:#4d8dff; --ok:#3fcf8e; --warn:#f5b04c; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f8fb; --card:#ffffff; --line:#d5dbe5; --ink:#1b2130; --mute:#5b6577; --acc:#2563eb; --ok:#16a26a; --warn:#c77d0a; } }
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; fill: var(--ink); }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
    .mute { fill: var(--mute); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.2; }
    .core { fill: var(--card); stroke: var(--acc); stroke-width: 1.6; }
    .wire { fill: none; stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 4 5; animation: flow 1.6s linear infinite; }
    .wire.back { animation-direction: reverse; }
    .chip { fill: none; stroke: var(--line); stroke-width: 1; }
    .dot { fill: var(--acc); }
    .dot.ok { fill: var(--ok); }
    .dot.hook { fill: var(--warn); }
    .verdict { opacity: 0; animation: verdict 6s ease-in-out infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: 280px 212px; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    @keyframes verdict { 0%, 52% { opacity: 0; transform: translateY(6px); } 60%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 30%, 60%, 100% { opacity: 1; } 40% { opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { .wire, .verdict, .pulse { animation: none; } .verdict { opacity: 1; } .moving { display: none; } }
  </style>

  <!-- agent -->
  <rect class="card" x="20" y="24" width="220" height="92" rx="12"/>
  <text x="38" y="54" font-size="15" font-weight="600">Coding agent</text>
  <text x="38" y="75" font-size="12" class="mute">Claude Code · Codex · any agent</text>
  <rect class="chip" x="38" y="86" width="104" height="20" rx="10"/>
  <text x="50" y="100" font-size="11" class="mute">reads the skill</text>

  <!-- events / hooks -->
  <rect class="card" x="320" y="24" width="220" height="92" rx="12"/>
  <text x="338" y="54" font-size="15" font-weight="600">Agent events</text>
  <text x="338" y="75" font-size="12" class="mute">before a command · after a fetch</text>
  <text x="338" y="92" font-size="12" class="mute">before a turn is handed back</text>

  <!-- jevx core -->
  <g class="pulse">
    <rect class="core" x="140" y="160" width="280" height="118" rx="14"/>
    <text x="160" y="190" font-size="17" font-weight="700">jevx</text>
    <text x="203" y="190" font-size="12" class="mute">one binary, no config needed</text>
    <rect class="chip" x="160" y="202" width="72" height="22" rx="11"/><text x="171" y="217" font-size="11">questions</text>
    <rect class="chip" x="238" y="202" width="86" height="22" rx="11"/><text x="249" y="217" font-size="11">## Jev context</text>
    <rect class="chip" x="330" y="202" width="72" height="22" rx="11"/><text x="342" y="217" font-size="11">plugins</text>
    <rect class="chip" x="160" y="230" width="72" height="22" rx="11"/><text x="172" y="245" font-size="11">thresholds</text>
    <rect class="chip" x="238" y="230" width="86" height="22" rx="11"/><text x="250" y="245" font-size="11">parallel batch</text>
    <rect class="chip" x="330" y="230" width="72" height="22" rx="11"/><text x="345" y="245" font-size="11">validate</text>
    <text x="160" y="268" font-size="11" class="mute">key read from TYPESAFE_API_KEY at send time</text>
  </g>

  <!-- model -->
  <rect class="card" x="170" y="330" width="220" height="80" rx="12"/>
  <text x="188" y="358" font-size="15" font-weight="600">System One model</text>
  <text x="188" y="378" font-size="12" class="mute">hosted Jev · self-hosted · local</text>
  <text x="188" y="396" font-size="11" class="mute mono">noul · choice · score</text>

  <!-- wires -->
  <path id="w1" class="wire" d="M130 116 C 130 140, 200 140, 220 160"/>
  <path id="w2" class="wire" d="M430 116 C 430 140, 360 140, 340 160"/>
  <path id="w3" class="wire" d="M260 278 L 260 330"/>
  <path id="w4" class="wire back" d="M300 330 L 300 278"/>
  <path id="w5" class="wire back" d="M190 160 C 170 140, 90 140, 90 116"/>

  <!-- packets -->
  <g class="moving">
    <circle r="4.5" class="dot"><animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;0.18;1" keyPoints="0;1;1" calcMode="linear"><mpath href="#w1"/></animateMotion></circle>
    <circle r="4.5" class="dot"><animateMotion dur="6s" repeatCount="indefinite" begin="0s" keyTimes="0;0.22;0.36;1" keyPoints="0;0;1;1" calcMode="linear"><mpath href="#w3"/></animateMotion></circle>
    <circle r="4.5" class="dot ok"><animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;0.40;0.50;1" keyPoints="0;0;1;1" calcMode="linear"><mpath href="#w4"/></animateMotion></circle>
    <circle r="4.5" class="dot ok"><animateMotion dur="6s" repeatCount="indefinite" keyTimes="0;0.52;0.66;1" keyPoints="0;0;1;1" calcMode="linear"><mpath href="#w5"/></animateMotion></circle>
    <circle r="4" class="dot hook"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
  </g>

  <!-- the answer -->
  <g class="verdict">
    <rect x="20" y="424" width="520" height="34" rx="10" fill="none" stroke="var(--ok)" stroke-width="1.2"/>
    <text x="36" y="446" font-size="12.5" class="mono">$ jevx is "Is this urgent?" &lt; email.txt</text>
    <text x="330" y="446" font-size="12.5" class="mono" style="fill:var(--ok)">yes 0.92</text>
    <text x="410" y="446" font-size="12.5" class="mono mute">exit 0 → act</text>
  </g>
</svg>
