name: pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "install.sh", "install.cmd", "cmd/jevcli/skill/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp install.sh install.cmd docs/ && cp cmd/jevcli/skill/references/cookbook.md docs/cookbook.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
